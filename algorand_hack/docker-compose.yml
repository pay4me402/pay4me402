networks:
  hacknet:
    driver: bridge

services:
  proxy:
    build:
      context: .
      dockerfile: 402proxy/Dockerfile
    container_name: 402proxy
    ports:
      - '8089:8089'
    env_file:
      - .env
    volumes:
      - ./certs.json:/app/certs.json:ro
    networks:
      - hacknet
    restart: unless-stopped

  opencode:
    image: ghcr.io/pilinux/opencode:latest
    container_name: opencode
    entrypoint:
      - /bin/sh
      - -c
      - |
        node -e "const fs = require('fs'); const certs = JSON.parse(fs.readFileSync('/app/certs.json')); fs.writeFileSync('/tmp/ca.crt', certs.caCert);"
        exec opencode serve --hostname 0.0.0.0 --port 9000
    ports:
      - '9000:9000'
    environment:
      - HTTP_PROXY=http://proxy:8089
      - HTTPS_PROXY=http://proxy:8089
      - http_proxy=http://proxy:8089
      - https_proxy=http://proxy:8089
      - NODE_EXTRA_CA_CERTS=/tmp/ca.crt
      - REQUESTS_CA_BUNDLE=/tmp/ca.crt
      - CURL_CA_BUNDLE=/tmp/ca.crt
    volumes:
      - ./certs.json:/app/certs.json:ro
    networks:
      - hacknet

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    environment:
      - HTTP_PROXY=http://proxy:8089
      - HTTPS_PROXY=http://proxy:8089
      - http_proxy=http://proxy:8089
      - https_proxy=http://proxy:8089
      - TARGET_URL=https://x402.goplausible.xyz/examples/weather
    depends_on:
      - proxy
    volumes:
      - ./certs.json:/app/certs.json:ro
    networks:
      - hacknet
    entrypoint: ['python', '/app/client.py']